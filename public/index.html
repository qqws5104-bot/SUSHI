.mg-label .lb-code { flex: 0 0 1.9cqw; margin: 0 1.4cqw 1cqw; background: repeating-linear-gradient(90deg, #2b1d12 0 0.25cqw, transparent 0.25cqw 0.5cqw, #2b1d12 0.5cqw 0.65cqw, transparent 0.65cqw 1.05cqw); opacity: 0.85; }

/* ================= 지도 서빙 (귀중품, 2026-10-07) ================= */
.mg-map-top { display: flex; flex-direction: column; align-items: center; gap: 0.35rem; min-height: 2.2rem; margin-bottom: 0.5rem; }
.mg-flashbar { width: min(100%, 360px); height: 6px; border-radius: 999px; background: rgba(43, 29, 18, 0.1); overflow: hidden; }
.mg-flashbar > i { display: block; height: 100%; width: 0; background: var(--mg-accent); border-radius: 999px; }
.mg-phase { margin: 0; font-size: 0.86rem; font-weight: 700; text-align: center; color: var(--mg-ink); min-height: 1.3em; }

.mg-map {
  --ts: 60px; position: relative; margin: 0 auto; display: grid; gap: 3px; padding: 4px; border-radius: 12px;
  width: min(100%, calc(var(--cols) * var(--ts))); aspect-ratio: var(--cols) / var(--rows);
  grid-template-columns: repeat(var(--cols), 1fr); grid-template-rows: repeat(var(--rows), 1fr);
  background: #b9a37a; border: 1px solid var(--mg-line);
}
.mg-tile {
  position: relative; border-radius: 6px; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0;
  background: repeating-linear-gradient(45deg, #efe3c8 0 8px, #eadcbc 8px 16px); /* 길 */
}
.mg-tile.is-house { background: #f8f0dc; box-shadow: inset 0 0 0 2px rgba(122, 90, 48, 0.35); }
.mg-lab { position: absolute; inset: 7%; display: block; }
.mg-psvg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 2px 1.5px rgba(43, 29, 18, 0.35)); }
.mg-pnum { font-family: var(--mg-font-display); font-weight: 800; font-size: 30px; fill: #fff; stroke: #2b1d12; stroke-width: 4.2px; paint-order: stroke fill; stroke-linejoin: round; }
.mg-chk {
  position: absolute; right: -4px; top: -6px; width: 1.2rem; height: 1.2rem; border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 3;
  font-size: 0.8rem; font-weight: 800; background: var(--mg-ok); color: #fff; border: 2px solid #fff;
}
.mg-tile.is-delivered { background: rgba(47, 143, 82, 0.16); box-shadow: inset 0 0 0 2px var(--mg-ok); }
.mg-tile.is-delivered .mg-chk { display: inline-flex; }
.mg-tile.is-pop { animation: mg-pop 0.25s ease; }
.mg-tile.is-wrong { animation: mg-shake 0.32s ease; box-shadow: inset 0 0 0 3px var(--mg-danger); }
.mg-tile.is-block { background: repeating-linear-gradient(-45deg, #4a4540 0 8px, #e2b13c 8px 16px); }
.mg-fence { position: absolute; inset: 22% 14%; border-radius: 3px; background: rgba(43, 29, 18, 0.55); }
.mg-tile.is-depot { background: #3b4049; }
.mg-dep { font-family: var(--mg-font-display); font-weight: 700; font-size: 0.7rem; color: #f4f1ea; letter-spacing: 0.08em; position: absolute; top: 4px; }
.mg-cover {
  position: absolute; inset: 0; z-index: 6; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 0.7rem; border-radius: 12px;
  text-align: center; padding: 0.5rem; background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.035) 0 2px, transparent 2px 10px), linear-gradient(180deg, #46321f, #35261a);
}
.mg-cover-note { background: rgba(255, 252, 244, 0.85); padding: 0.25rem 0.8rem; border-radius: 999px; color: #5a4224; font-weight: 800; font-size: 0.8rem; }
.mg-map.is-covered .mg-cover { display: flex; }
/* 주문표만 붙은 초밥 팝업 */
.mg-parcels { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0.6rem 0.7rem; max-width: 100%; }
.mg-parcel { position: relative; animation: mg-popin 0.34s cubic-bezier(.2, 1.6, .4, 1) both; animation-delay: var(--d, 0ms); }
.mg-parcel .pbox { position: relative; display: block; width: 100px; height: 100px; }
.mg-parcel .pbox .mg-psvg { filter: drop-shadow(0 5px 6px rgba(0, 0, 0, 0.45)); }
.mg-parcel .pn {
  position: absolute; left: -7px; top: -9px; z-index: 2; width: 1.6rem; height: 1.6rem; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-style: normal; font-family: var(--mg-font-display); font-weight: 800; font-size: 0.95rem; background: var(--mg-accent); color: var(--mg-accent-ink); border: 2px solid #fff;
}
.mg-parcel .pk { position: absolute; right: -6px; top: -8px; z-index: 2; display: none; width: 1.3rem; height: 1.3rem; border-radius: 50%; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 800; background: var(--mg-ok); color: #fff; border: 2px solid #fff; }
.mg-parcel.is-done .pbox { opacity: 0.4; filter: grayscale(0.6); }
.mg-parcel.is-done .pk { display: flex; }
@keyframes mg-popin { from { transform: scale(0.15) translateY(14px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
.mg-courier {
  position: absolute; z-index: 4; pointer-events: none; padding: 4px; /* 지도 padding(4px)과 같다 */
  width: calc((100% - 8px - (var(--cols) - 1) * 3px) / var(--cols)); height: calc((100% - 8px - (var(--rows) - 1) * 3px) / var(--rows));
  left: calc(4px + var(--cx) * ((100% - 8px - (var(--cols) - 1) * 3px) / var(--cols) + 3px));
  top: calc(4px + var(--cy) * ((100% - 8px - (var(--rows) - 1) * 3px) / var(--rows) + 3px));
  transition: left 0.09s linear, top 0.09s linear; display: flex; align-items: flex-end; justify-content: center;
}
.mg-courier svg { width: 88%; height: 88%; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.35)); }
.mg-van-box { fill: rgba(43, 29, 18, 0.18); stroke: none; } .mg-van-cab { fill: #f4b27a; stroke: #7a3a0e; stroke-width: 1.4; } .mg-van-wh { fill: #2b1d12; }
.mg-courier.is-bump { animation: mg-shake 0.2s ease; }
.mg-map-foot { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin: 0.6rem auto 0.2rem; width: min(100%, 420px); }
.mg-dots { display: flex; gap: 0.35rem; }
.mg-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--mg-line); background: #fff; }
.mg-dot.is-current { border-color: var(--mg-accent); }
.mg-dot.is-done { background: var(--mg-ok); border-color: var(--mg-ok); }
.mg-replay {
  font: inherit; font-size: 0.8rem; font-weight: 700; cursor: pointer; padding: 0.3rem 0.8rem; border-radius: 999px; color: var(--mg-ink);
  background: transparent; border: 1px solid var(--mg-line);
}
.mg-replay:hover:not(:disabled) { background: rgba(43, 29, 18, 0.06); }
.mg-replay:disabled { opacity: 0.4; cursor: default; }
.mg-kind-map .mg-pad, .mg-kind-sticker .mg-pad { margin-top: 0.3rem; }
@media (max-width: 480px) { .mg-map { --ts: 52px; } .mg-parcel .pbox { width: 68px; height: 68px; } }
@media (max-height: 820px) {
  .mg-map { --ts: 50px; }
  .mg-map-top { min-height: 2rem; margin-bottom: 0.3rem; }
  .mg-kind-map .mg-freeze-note { margin: 0 0 0.2rem; }
}

@media (prefers-reduced-motion: reduce) {
  .mg-root * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
@media (max-width: 480px) {
  .mg-root { padding: 0.8rem 0.7rem 0.9rem; }
  .mg-box { transform: scale(0.86); transform-origin: top center; margin-bottom: -26px; }
}
/* 2026-10-06: 노트북처럼 화면 높이가 낮을 때(브라우저 주소창/북마크바 빼고 ~650px) 박스 포장 창이 화면보다 커져서
   아래쪽이 잘렸다 -> 낮은 화면에서는 박스 그림을 줄이고 화면 방향키를 한 줄로 눕힌다. */
@media (max-height: 820px) {
  .mg-box { transform: scale(0.72); transform-origin: top center; margin-bottom: -58px; }
  .mg-pack-stage { padding-bottom: 0.2rem; }
  .mg-freeze-note { margin-bottom: 0.2rem; }
  .mg-seq { margin-bottom: 0.6rem; }
  .mg-pad { grid-template-columns: repeat(4, 1fr) 2.4fr; grid-template-rows: 46px; width: min(100%, 440px); margin: 0 auto; }
  .mg-key[data-k="left"]  { grid-column: 1; grid-row: 1; }
  .mg-key[data-k="down"]  { grid-column: 2; grid-row: 1; }
  .mg-key[data-k="up"]    { grid-column: 3; grid-row: 1; }
  .mg-key[data-k="right"] { grid-column: 4; grid-row: 1; }
  .mg-key[data-k="space"] { grid-column: 5; grid-row: 1; }
}
@media (max-height: 700px) {
  .mg-stage { width: 88%; margin-left: auto; margin-right: auto; } /* 주문표 붙이기 작업대: 아주 낮은 화면에서 조금 줄인다(cqw 단위라 내용도 같이 줄어듦) */
}

/* ================= 박스 포장 (조각 채워 넣기 퍼즐) ================= */
.pk-wrap { container-type: inline-size; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: flex-start; margin-top: 0.5rem; }
.pk-box {
  --cell: min(13cqw, 64px);
  display: grid; grid-template-columns: repeat(var(--cols), var(--cell)); grid-auto-rows: var(--cell); gap: 3px; padding: 8px;
  border-radius: 10px; background: #8a6a3a; border: 3px solid #6b4e26; box-shadow: inset 0 0 0 3px #b08d55, 0 6px 14px rgba(43, 29, 18, 0.25);
}
.pk-box.is-shake { animation: mg-shake 0.32s ease; }
.pk-cell { border-radius: 4px; background: #e6d3a8; box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35), inset 0 -2px 0 rgba(60, 38, 14, 0.18); transition: background 0.08s; }
.pk-cell.is-fill { background: var(--pc); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35), inset 0 -3px 0 rgba(0, 0, 0, 0.22); }
.pk-cell.is-ghost { background: color-mix(in srgb, var(--pc) 62%, #fffcf4); outline: 3px solid var(--pc); outline-offset: -3px; }
.pk-cell.is-bad { background: rgba(199, 64, 45, 0.62); outline: 3px solid var(--mg-danger); outline-offset: -3px; }
.pk-tray { display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; justify-content: center; max-width: 240px; min-width: 150px; }
.pk-piece {
  font: inherit; cursor: pointer; padding: 6px; min-width: 62px; min-height: 62px; display: flex; align-items: center; justify-content: center;
  border-radius: 10px; background: var(--mg-panel); border: 2px solid var(--mg-line); border-bottom-width: 4px;
}
.pk-piece.is-active { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 14%, #fffcf4); transform: translateY(-2px); box-shadow: 0 4px 0 color-mix(in srgb, var(--pc) 40%, transparent); }
.pk-piece.is-placed { opacity: 0.38; cursor: default; }
.pk-mg { --m: min(3.4cqw, 17px); display: grid; grid-template-columns: repeat(var(--cols), var(--m)); grid-auto-rows: var(--m); gap: 2px; }
.pk-mini { border-radius: 2px; background: transparent; }
.pk-mini.on { background: var(--pc); }
.pk-pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: min(100%, 460px); margin: 0.5rem auto 0; }
.pk-pad .mg-key { min-height: 46px; padding: 0 0.3rem; }
.pk-pad .pk-act { grid-column: span 1; font-size: 0.74rem; line-height: 1.15; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.pk-pad .pk-act small { font-size: 0.6rem; opacity: 0.65; letter-spacing: 0.08em; }
@container (max-width: 520px) { .pk-box { --cell: min(15cqw, 56px); } .pk-tray { max-width: none; } }

/* ================= 창고 정리 (소코반) ================= */
.sk-wrap { container-type: inline-size; display: flex; justify-content: center; }
.sk-board {
  --cell: min(calc(94cqw / var(--cols)), 56px);
  position: relative; width: calc(var(--cell) * var(--cols)); height: calc(var(--cell) * var(--rows));
  border-radius: 8px; overflow: hidden; background: #cdb88f; box-shadow: 0 0 0 3px #7a5a30;
}
.sk-board.is-shake { animation: mg-shake 0.32s ease; }
.sk-floor { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--cols), 1fr); grid-template-rows: repeat(var(--rows), 1fr); }
.sk-cell { display: block; background: #e8d9b6; box-shadow: inset 0 0 0 1px rgba(122, 90, 48, 0.12); }
.sk-cell.is-wall {
  background: repeating-linear-gradient(0deg, #8a6a42 0 7px, #75583a 7px 8px), #8a6a42;
  box-shadow: inset 0 0 0 1px rgba(43, 29, 18, 0.35);
}
.sk-cell.is-tgt {
  background: radial-gradient(circle at 50% 50%, #fff 0 33%, #d4ccb8 35% 40%, #fff 42% 56%, transparent 58%), #efe3c2;
  box-shadow: inset 0 0 0 2px #cfc3a4;
}
.sk-box, .sk-man {
  position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell);
  transform: translate(calc(var(--x) * var(--cell)), calc(var(--y) * var(--cell)));
  transition: transform 90ms ease-out; pointer-events: none;
}
.sk-box svg, .sk-man svg { width: 100%; height: 100%; display: block; }
.sk-bx-body { fill: #c9a576; stroke: #6b4e26; stroke-width: 1.8; }
.sk-bx-top { fill: #ddc08f; stroke: #6b4e26; stroke-width: 1.8; }
.sk-bx-tape { fill: #ead8b0; opacity: 0.95; }
.sk-bx-ok { fill: none; stroke: #fff; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.sk-box.is-in .sk-bx-body { fill: #6fbf86; }
.sk-box.is-in .sk-bx-top { fill: #93d3a6; }
.sk-box.is-in .sk-bx-ok { opacity: 1; }
.sk-box.is-dead .sk-bx-body { fill: #d98a7d; }
.sk-box.is-dead .sk-bx-top { fill: #e6a99f; }
.sk-man { z-index: 2; }
.sk-m-face { fill: #f2c9a0; stroke: #6b4e26; stroke-width: 1.4; }
.sk-m-cap { fill: #fffdf7; stroke: #a8a090; stroke-width: 1.4; }
.sk-m-brim { fill: #e2dccb; }
.sk-m-line { fill: none; stroke: #cfc7b3; stroke-width: 1.4; stroke-linecap: round; }
.sk-m-body { fill: #fbf8f0; stroke: #a8a090; stroke-width: 1.4; }
.sk-m-eye { fill: #2b1d12; }
@keyframes sk-bump {
  0%, 100% { transform: translate(calc(var(--x) * var(--cell)), calc(var(--y) * var(--cell))); }
  30% { transform: translate(calc(var(--x) * var(--cell) - 4px), calc(var(--y) * var(--cell))); }
  65% { transform: translate(calc(var(--x) * var(--cell) + 3px), calc(var(--y) * var(--cell))); }
}
.sk-man.is-bump { animation: sk-bump 0.18s ease; }
.sk-status { display: flex; justify-content: center; gap: 1.6rem; margin: 0.5rem 0 0; font-size: 0.85rem; color: var(--mg-muted); }
.sk-status b { color: var(--mg-ink); font-family: var(--mg-font-display); font-size: 1rem; }
.sk-pad { grid-template-columns: repeat(4, 1fr); }
.sk-pad .pk-act { grid-column: span 2; }

/* ================= 소코반류 시험용 게임 5종 (빙판 서빙 / 서빙 경로 / 쌍둥이 서빙 / 컨베이어 잇기 / 초밥 쌓기) ================= */
/* 빙판 서빙 */
.sk-cell.is-ice { background: repeating-linear-gradient(90deg, rgba(150, 105, 50, 0.07) 0 2px, transparent 2px 9px), linear-gradient(135deg, #f1dfb8, #e6cf9f); box-shadow: inset 0 0 0 1px rgba(122, 90, 48, 0.2); }
.sk-cell.is-rock { background: radial-gradient(circle at 35% 30%, #b8dd8c, #5f9a3a 70%); box-shadow: inset 0 0 0 2px rgba(40, 80, 25, 0.35); border-radius: 38%; }
.ic-item.is-gone { opacity: 0; transform: translate(calc(var(--x) * var(--cell)), calc(var(--y) * var(--cell))) scale(0.4); }
.ic-item { transition: opacity 0.15s, transform 0.15s; }
.ic-man { transition-property: transform; transition-timing-function: cubic-bezier(.25, .8, .35, 1); }

/* 쌍둥이 서빙 */
.sk-cell.is-tgt.tw-ga { background: repeating-linear-gradient(45deg, #ffd9b5 0 6px, #ffc58a 6px 12px); box-shadow: inset 0 0 0 2px #e2691a; }
.sk-cell.is-tgt.tw-gb { background: repeating-linear-gradient(45deg, #cfe3fb 0 6px, #aecdf3 6px 12px); box-shadow: inset 0 0 0 2px #2f6fb8; }
.sk-cell.tw-ga, .sk-cell.tw-gb { display: flex; align-items: center; justify-content: center; font-family: var(--mg-font-display); font-weight: 700; font-size: calc(var(--cell) * 0.5); color: rgba(43, 29, 18, 0.55); }
.sk-man b { position: absolute; right: 2px; bottom: 0; font-family: var(--mg-font-display); font-size: calc(var(--cell) * 0.34); line-height: 1; color: #fff; text-shadow: 0 0 3px #2b1d12, 0 0 3px #2b1d12; }
.tw-b .sk-m-cap { fill: #2f6fb8; stroke: #1c4a82; }
.tw-b .sk-m-brim { fill: #245b99; }
.tw-b .sk-m-body { fill: #8a5a2a; stroke: #5a3a18; }
.sk-man.is-home { filter: drop-shadow(0 0 4px #2f8f52); }

/* 서빙 경로 */
.sk-cell.is-road { background: repeating-linear-gradient(90deg, rgba(150, 105, 50, 0.06) 0 2px, transparent 2px 9px), #f1e2bd; box-shadow: inset 0 0 0 1px rgba(122, 90, 48, 0.18); }
.sk-cell.is-road.is-trail { background: #f7dca0; }
.sk-cell.is-road.is-start { box-shadow: inset 0 0 0 3px #e2691a; }
.rt-board .sk-cell.is-wall { background: repeating-linear-gradient(45deg, #b9b2a2 0 5px, #a9a190 5px 10px); box-shadow: inset 0 0 0 1px rgba(60, 50, 30, 0.25); }
.rt-line { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.rt-line polyline { stroke: #e2691a; stroke-width: 0.22; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
.rt-man { z-index: 2; }
.sk-board.is-doomed { box-shadow: 0 0 0 3px var(--mg-danger); }

/* 컨베이어 잇기 */
.pp-wrap { position: relative; width: min(100%, 440px); margin: 0 auto; padding: 0 3.2rem; }
.pp-board { --cell: min(calc((100cqw - 6.4rem) / var(--cols)), 64px); display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 4px; padding: 4px; background: #7a5a30; border-radius: 10px; }
.pp-in, .pp-out { position: absolute; top: calc(4px + (100% - 8px) * (var(--r) + 0.5) / var(--rows)); transform: translateY(-50%); font-size: 0.68rem; font-weight: 800; color: var(--mg-muted); white-space: nowrap; }
.pp-in { left: 0; } .pp-out { right: 0; }
.pp-tile { aspect-ratio: 1; padding: 0; border: 0; border-radius: 6px; background: #efe4c8; box-shadow: inset 0 0 0 1px rgba(122, 90, 48, 0.2); cursor: pointer; display: block; }
.pp-tile svg { width: 100%; height: 100%; display: block; transition: transform 0.12s; }
.pp-arm, .pp-hub { fill: #a9a08a; }
.pp-tile.is-flow { background: #dff1fb; }
.pp-tile.is-flow .pp-arm, .pp-tile.is-flow .pp-hub { fill: #3c8fd6; }
.pp-tile.is-cursor { outline: 3px solid var(--mg-accent); outline-offset: -3px; }

/* 초밥 쌓기 (하노이) */
.hn-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(100%, 460px); margin: 0 auto; }
.hn-peg { position: relative; height: 190px; border-radius: 10px; background: #efe4c8; box-shadow: inset 0 0 0 1px rgba(122, 90, 48, 0.2); display: flex; align-items: flex-end; justify-content: center; }
.hn-peg.is-cursor { box-shadow: inset 0 0 0 3px var(--mg-accent); background: #f8ebc6; }
.hn-peg.is-shake { animation: mg-shake 0.32s ease; }
.hn-pole { position: absolute; bottom: 0; width: 8px; height: 88%; background: #8a6a42; border-radius: 4px 4px 0 0; }
.hn-stack { position: relative; width: 100%; display: flex; flex-direction: column-reverse; align-items: center; gap: 3px; padding-bottom: 6px; }
.hn-box { width: var(--w); height: 26px; border-radius: 4px; position: relative; background: hsl(calc(28 + var(--k) * 24) 62% 62%); border: 2px solid rgba(80, 50, 20, 0.6); }
.hn-box i { position: absolute; left: 50%; top: 0; bottom: 0; width: 12%; transform: translateX(-50%); background: rgba(255, 244, 214, 0.75); }
.hn-hand { position: relative; height: 38px; width: min(100%, 460px); margin: 6px auto 0; }
.hn-held { position: absolute; top: 0; left: calc((var(--p) * 33.33%) + 0.5%); width: 32%; display: flex; justify-content: center; transition: left 0.1s; }
.hn-held .hn-box { margin: 0 auto; }

/* 제작 중인 초밥 칩 (헤더) + 초밥 담기의 수집 아이템 */
.mg-making { display: inline-flex; align-items: center; gap: 0.3rem; margin-left: 0.5rem; padding: 0.1rem 0.5rem 0.1rem 0.25rem; border-radius: 999px; background: #fff4e0; border: 1px solid #e0c79a; font-size: 0.78rem; color: #2b1d12; white-space: nowrap; }
.mg-making b { font-weight: 800; }
.mg-sushi-svg { width: 2.2rem; height: auto; display: block; }
.ic-sushi { transform: scale(1.18); }

/* mainview.css -- 메인 모니터(?view=main) 전용 스타일. 큰 TV/프로젝터 화면용이라 모든 크기를 vh/vw로 잡는다.
 * 플레이어 화면과 같은 색 토큰(--bg, --gold, --ink ...)을 쓰고, 이 화면은 body.main-view 일 때만 적용된다. */
body.main-view { overflow: hidden; }
body.main-view #app { height: 100vh; min-height: 0; }
.mv { height: 100vh; display: flex; flex-direction: column; gap: 2.4vh; padding: 2.6vh 3vw 3vh; background: linear-gradient(180deg, var(--bg-deep), var(--bg) 22%); }
.mv-head { display: flex; align-items: center; justify-content: space-between; gap: 2vw; flex: 0 0 auto; }
.mv-eyebrow { font-family: var(--font-display); font-size: 1.7vh; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.mv-head h1 { margin: 0.4vh 0 0; font-size: 4vh; font-weight: 800; }
.mv-chips { display: flex; align-items: center; gap: 1vw; }
.mv-chip { padding: 0.9vh 1.5vw; border-radius: 999px; font-family: var(--font-display); font-weight: 700; font-size: 2.4vh; letter-spacing: 0.04em; white-space: nowrap; }
.mv-chip.phase { background: rgba(226, 105, 26, 0.12); border: 2px solid rgba(226, 105, 26, 0.5); color: var(--gold); }
.mv-chip.room { background: rgba(37, 105, 168, 0.1); border: 2px solid rgba(37, 105, 168, 0.4); color: var(--sky); }
.mv-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 2.6vh; }
.mv-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2.4vh; }
.mv-center h2 { margin: 0; font-size: 7vh; font-weight: 800; }
.mv-center p { margin: 0; font-size: 3vh; color: var(--muted); }

/* ---------- 큰 시계 ---------- */
.mv-label { font-family: var(--font-display); font-size: 3.4vh; font-weight: 700; letter-spacing: 0.08em; color: var(--muted); }
.mv-time { font-family: var(--font-display); font-weight: 700; line-height: 0.95; font-variant-numeric: tabular-nums; color: var(--ink); }
.mv-time small { font-size: 0.3em; margin-left: 0.15em; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; }
.mv-time.is-low { color: var(--danger); animation: mv-pulse 1s ease-in-out infinite; }
@keyframes mv-pulse { 50% { opacity: 0.55; } }
.mv-bar { height: 2.2vh; border-radius: 999px; background: rgba(43, 29, 18, 0.1); overflow: hidden; }
.mv-bar > i { display: block; height: 100%; width: 100%; background: var(--gold); border-radius: 999px; transition: width 0.25s linear; }
.mv-bar > i.is-low { background: var(--danger); }

/* ---------- 제작 단계 ---------- */
.mv-secure-top { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 1.2vh; }
.mv-secure-top .mv-time { font-size: min(27vh, 22vw); }
.mv-secure-top .mv-bar { width: 100%; }
.mv-cats { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.6vw; }
.mv-cat { --c: #ccc; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 1vh; padding: 2.4vh 1vw 2.6vh; border-radius: 2.6vh; background: var(--c); color: var(--ink); border: 0.5vh solid rgba(22, 35, 63, 0.18); box-shadow: 0 1vh 2.4vh rgba(43, 29, 18, 0.16); position: relative; overflow: hidden; }
.mv-cat-head { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0.8vw; }
.mv-cat-icon { width: 4.6vh; height: 4.6vh; flex: 0 0 auto; }
.mv-cat-icon svg { width: 100%; height: 100%; display: block; }
.mv-cat-name { font-size: min(3.4vh, 1.9vw); font-weight: 800; letter-spacing: -0.01em; }
.mv-cat-game { font-size: 2vh; font-weight: 700; opacity: 0.7; }
.mv-left { font-family: var(--font-display); font-weight: 700; font-size: min(20vh, 11vw); line-height: 0.9; font-variant-numeric: tabular-nums; }
.mv-left small { font-size: 0.24em; margin-left: 0.2em; opacity: 0.65; font-weight: 600; }
.mv-pips { display: flex; gap: 0.7vw; }
.mv-pip { width: min(3.6vh, 1.6vw); height: min(3.6vh, 1.6vw); border-radius: 0.8vh; background: var(--ink); opacity: 0.85; border: 0.35vh solid var(--ink); transition: opacity 0.3s, background 0.3s; }
.mv-pip.is-gone { background: transparent; opacity: 0.35; border-style: dashed; }
.mv-cat.is-empty { filter: grayscale(0.7); opacity: 0.6; }
.mv-cat.is-empty::after { content: "소진"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-12deg); padding: 0.6vh 2vw; border: 0.8vh solid var(--danger); color: var(--danger); font-family: var(--font-display); font-size: min(9vh, 4.4vw); font-weight: 800; letter-spacing: 0.08em; border-radius: 1.4vh; background: rgba(255, 252, 244, 0.85); white-space: nowrap; }
.mv-cat.is-few .mv-left { color: var(--danger); }

/* ---------- 회전 벨트 단계 ---------- */
.mv-elev { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.4fr); gap: 4vw; }
.mv-shaft { position: relative; align-self: center; border-radius: 2.4vh; background: rgba(43, 29, 18, 0.07); border: 0.5vh solid rgba(43, 29, 18, 0.22); padding: 1.6vh; container-type: inline-size; max-height: 100%; }
.mv-shaft .belt-ring { transition-duration: 0.7s; }
.mv-elev-main { display: flex; flex-direction: column; justify-content: center; gap: 2.6vh; min-width: 0; }
.mv-round { align-self: flex-start; padding: 0.8vh 1.6vw; border-radius: 999px; background: var(--ink); color: var(--bg); font-family: var(--font-display); font-weight: 700; font-size: 3.4vh; letter-spacing: 0.06em; }
.mv-nowfloor { display: flex; align-items: baseline; gap: 2vw; }
.mv-nowfloor .mv-label { font-size: 4vh; }
.mv-floor-big { font-family: var(--font-display); font-weight: 800; font-size: min(34vh, 16vw); line-height: 0.9; color: var(--gold); }
.mv-state { font-size: 4.6vh; font-weight: 800; }
.mv-elev-main .mv-time { font-size: min(24vh, 14vw); }
.mv-wait { font-size: 4vh; font-weight: 700; color: var(--muted); }

/* ---------- 대기/하프타임/종료 ---------- */
.mv-seats { display: flex; gap: 3vw; margin-top: 1vh; }
.mv-seat { min-width: 26vw; padding: 3vh 2vw; border-radius: 2.4vh; background: var(--panel); border: 0.5vh solid var(--panel-line); font-size: 3.6vh; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 1vh; }
.mv-seat.is-on { border-color: var(--c, var(--gold)); }
.mv-seat.is-ready { background: rgba(47, 143, 82, 0.12); border-color: var(--ok); }
.mv-seat .mv-seat-icon { width: 8vh; height: 8vh; color: var(--c, var(--muted)); }
.mv-seat .mv-seat-icon svg { width: 100%; height: 100%; }
.mv-seat small { font-size: 2.4vh; font-weight: 700; color: var(--muted); }
.mv-join { margin-top: 2vh; font-size: 3vh; color: var(--muted); }
.mv-join b { display: block; margin-top: 0.8vh; color: var(--ink); font-size: 4.6vh; letter-spacing: 0.02em; word-break: break-all; }
.mv-code { font-family: var(--font-display); font-weight: 800; font-size: 14vh; letter-spacing: 0.12em; color: var(--sky); line-height: 1; }
.mv-scores { display: flex; gap: 4vw; justify-content: center; }
.mv-score { min-width: 24vw; padding: 3vh 2vw; border-radius: 2.4vh; background: var(--panel); border: 0.5vh solid var(--panel-line); font-size: 3.6vh; font-weight: 800; }
.mv-score b { display: block; margin-top: 1vh; font-family: var(--font-display); font-size: 9vh; color: var(--gold); }
.mv-winner { font-size: 9vh; font-weight: 800; color: var(--gold); }
@media (prefers-reduced-motion: reduce) { .belt-ring, .mv-bar > i { transition: none; } .mv-time.is-low { animation: none; } }
.mv-join-rail { margin-top: 1.2vh; font-size: 2.4vh; }
.mv-join-rail b { font-size: 3.2vh; }

/* ---------- 2026-10-12 POP 테마 (메인 모니터) ---------- */
.mv { background: var(--pop-cream); }
.mv-head h1, .mv-center h2, .mv-winner, .mv-label, .mv-time, .mv-left, .mv-round, .mv-floor-big, .mv-state, .mv-chip, .mv-cat-name { font-family: var(--font-pop); font-weight: 400; }
.mv-eyebrow { color: var(--gold); }
.mv-chip.phase { background: var(--pop-yellow); border: 0.4vh solid var(--ink); color: var(--ink); box-shadow: 0 0.5vh 0 var(--ink); }
.mv-chip.room { background: #fff; border: 0.4vh solid var(--ink); color: var(--ink); box-shadow: 0 0.5vh 0 var(--ink); }
.mv-splash { background: #9bd3f5 var(--hero) center 28% / cover no-repeat; }
.mv-splash .mv-head { display: none; }
.mv-splash .mv-body { justify-content: flex-end; }
.mv-splash .mv-center { flex: 0 0 auto; }
.mv-panel { width: min(74vw, 1180px); padding: 1.6vh 2vw 2vh; background: rgba(255, 255, 255, 0.94); border: 0.5vh solid var(--ink); border-radius: 2.6vh; box-shadow: 0 1vh 0 var(--ink); display: flex; flex-direction: column; align-items: center; gap: 1.2vh; }
.mv-panel h2 { font-size: 4vh; }
.mv-panel .mv-seats { margin-top: 0; gap: 2vw; }
.mv-panel .mv-seat { min-width: 18vw; padding: 1.2vh 1.2vw; font-size: 3.2vh; flex-direction: row; gap: 1.2vw; }
.mv-panel .mv-seat .mv-seat-icon { width: 5vh; height: 5vh; }
.mv-panel .mv-join { margin-top: 0; font-size: 2.2vh; }
.mv-panel .mv-join b { font-size: 3.2vh; margin-top: 0.4vh; }
.mv-panel .mv-join-rail { font-size: 1.9vh; }
.mv-panel .mv-join-rail b { font-size: 2.4vh; }
.mv-seat, .mv-score { border: 0.5vh solid var(--ink); border-radius: 2.4vh; background: #fff; box-shadow: 0 1vh 0 var(--ink); }
.mv-seat.is-on { background: color-mix(in srgb, var(--c, var(--gold)) 14%, #fff); }
.mv-seat.is-ready { background: #b9f0c6; }
.mv-join b { background: var(--pop-yellow); border: 0.4vh solid var(--ink); border-radius: 1.4vh; padding: 0.2vh 1.2vw; display: inline-block; }
.mv-bar { background: #fff; border: 0.4vh solid var(--ink); }
.mv-bar > i { background: var(--gold); }
.mv-cat { border: 0.6vh solid var(--ink); border-radius: 2.6vh; box-shadow: 0 1vh 0 var(--ink); }
.mv-pip { border-color: var(--ink); }
.mv-round { background: var(--ink); color: var(--pop-yellow); }
.mv-shaft { background: #ffe9b0; border: 0.6vh solid var(--ink); box-shadow: 0 1vh 0 var(--ink); }
.mv-floor-big { color: var(--ink); text-shadow: 0.5vh 0.5vh 0 var(--pop-yellow); }
.mv-winner { color: var(--ink); background: var(--pop-yellow); border: 0.6vh solid var(--ink); border-radius: 2.4vh; padding: 0.6vh 3vw; box-shadow: 0 1vh 0 var(--ink); font-size: 7vh; }
.mv-score b { color: var(--gold); }

</style>

<div id="app"></div>
<div class="overlay hidden" id="mg-layer"></div>
<script>/* minigames.js -- 초밥 제작 미니게임 4종 (상자 포장 / 이상 확인 / 주문표 붙이기 / 주문 서빙)
 *
 * 바닐라 JS, 의존성 없음. 게임 본체(build_client.py)에 그대로 인라인하거나, 단독 시험장 페이지에서
 * 똑같이 쓸 수 있게 만들었다.
 *
 *   var ctl = MiniGames.start(hostElement, {
 *     kind: "pack" | "inspect" | "sticker" | "map" | "soko" | "ice" | "route" | "twin" | "pipe" | "hanoi",
 *     level: 1 | 2 | 3,              // 쉬움 / 보통 / 어려움
 *     label: "B08호",                // 주문표 붙이기에서 주문표에 찍을 목적지 (없으면 임의 생성)
 *     onDone:   function (res) {},   // res = { ok:true, kind, level, ms, mistakes }
 *     onCancel: function () {},      // "포기" 버튼
 *   });
 *   ctl.destroy();                   // 키 입력 리스너/타이머 정리 (오버레이를 닫을 때 반드시 호출)
 *
 * 한 칸의 시간제한은 따로 없다 -- 전체 제작 시간(3분)이 곧 시계다. 실패 상태도 없고, 다 풀어야 끝난다.
 */
(function (root) {
  "use strict";

  var KINDS = {
    pack:    { name: "상자 포장" },
    inspect: { name: "이상 확인" },
    sticker: { name: "주문표 붙이기" },
    map:     { name: "주문 서빙" },
    soko:    { name: "재료 정리" },
    ice:     { name: "초밥 담기" },
    route:   { name: "도마 닦기" },
    twin:    { name: "쌍둥이 서빙" },
    pipe:    { name: "컨베이어 잇기" },
    hanoi:   { name: "초밥 쌓기" },
  };
  var LEVEL_NAME = ["쉬움", "보통", "어려움"];

  // 제작하는 초밥 (표시 전용 -- 어떤 키가 어떤 종류에 속하는지는 game-data.js의 TYPES[].sushi가 정한다).
  // 그림은 위에서 본 니기리: 밥 + 네타(topping). 헤더 칩, 초밥 담기의 수집 아이템, 주문표 목록에서 같이 쓴다.
  var SUSHI_TOP = {
    egg: '<rect x="26" y="34" width="48" height="26" rx="6" fill="#f4cf4a"/><rect x="45" y="30" width="10" height="32" rx="2" fill="#1f2a24"/>',
    tofu: '<path d="M24 56q-2-22 26-24q28 2 26 24z" fill="#d9922e"/><path d="M30 44h40" stroke="#b36f17" stroke-width="2.4" stroke-dasharray="4 4"/><ellipse cx="50" cy="35" rx="14" ry="5" fill="#fdfbf4"/>',
    salmon: '<ellipse cx="50" cy="46" rx="28" ry="13" fill="#f08a4b"/><path d="M28 44q10-5 18 0M44 39q10-5 18 0M52 50q9-4 16 0" stroke="#ffd9bd" stroke-width="2.4" fill="none" stroke-linecap="round"/>',

  // 상자 포장에서 방향키를 잘못 눌렀을 때의 규칙 (2026-10-06 결정: 영상처럼 "reset" -- 처음부터 다시).

  //   freeze : 0.5초 멈췄다가 있던 자리부터 이어서

  //   ← ↑ ↓ → 조각 이동   SPACE 회전   ENTER 놓기   BACKSPACE 되돌리기   TAB 다른 조각 고르기
  // 2026-10-07 재설계 (사용자 피드백: "방향키 6키 -> 15키 -> 30키는 손가락 노동이다. 우봉고에서 가져올 건 해결 과정 --
  //   내가 판단하고, 직접 조작하고, 실수하면 다시 생각하는 것"). 예전엔 화면에 뜬 방향키 순서를 따라 누르는 게임이었다.
  // 퍼즐은 항상 풀리게 만든다: 칸을 조각들로 무작위 분할(`makePackPlan`)한 뒤 조각을 돌려서 보여 준다. 정답 배치는 하나가 아니어도 된다 --

  // 겹치게 놓으려 하면 실수 +1 (움직이는 건 자유, ENTER로 확정할 때만 판정). 조각 수/칸 크기가 난이도.
  // ======================================================================
  var PACK_CFG = [
    { cols: 3, rows: 3, sizes: [3, 3, 3] },          // 쉬움 (시험장 전용)
    { cols: 4, rows: 4, sizes: [4, 4, 4, 4] },       // 보통 (전반): 4칸짜리 4조각
    { cols: 5, rows: 4, sizes: [3, 4, 4, 4, 5] },    // 어려움 (후반): 3~5칸짜리 5조각
  ];
  var PACK_COLORS = ["#E8681C", "#2F8F52", "#3E7CB1", "#B5527F", "#C99A00", "#7B5EA7"];
  var PACK_LOCK_MS = 600;   // 겹치는 자리에 놓으려다 틀린 뒤 멈춤 (ENTER 연타로 때려 맞추기 방지)

  function normCells(cells) {
    var mx = 1e9, my = 1e9;
    cells.forEach(function (p) { if (p[0] < mx) mx = p[0]; if (p[1] < my) my = p[1]; });
    return cells.map(function (p) { return [p[0] - mx, p[1] - my]; });
  }
  function rotCells(cells, n) { // 시계 방향 90도 n번 (화면 y는 아래로 증가)
    var out = cells.map(function (p) { return [p[0], p[1]]; });
    for (var r = 0; r < ((n % 4) + 4) % 4; r++) out = out.map(function (p) { return [-p[1], p[0]]; });
    return normCells(out);
  }
  function cellsKey(cells) { return cells.map(function (p) { return p[0] + "." + p[1]; }).sort().join("|"); }
  function canonShape(cells) { // 회전해서 같아지는 모양은 같은 키
    var best = null;
    for (var r = 0; r < 4; r++) { var k = cellsKey(rotCells(cells, r)); if (best === null || k < best) best = k; }
    return best;
  }
  function boxDims(cells) {
    var w = 0, h = 0;
    cells.forEach(function (p) { if (p[0] + 1 > w) w = p[0] + 1; if (p[1] + 1 > h) h = p[1] + 1; });
    return { w: w, h: h };
  }

  // cols x rows 칸을 sizes 크기의 연결된 조각들로 쪼갠다 (무작위로 자라게 한 뒤, 막히면 다시). 모양이 서로 다른 조각들을 선호한다.
  function makePackPlan(cfg) {
    var W = cfg.cols, H = cfg.rows, N = W * H, K = cfg.sizes.length, fallback = null;
    for (var attempt = 0; attempt < 800; attempt++) {
      var owner = [], cells = [], remain = cfg.sizes.slice(), ok = true, i;
      for (i = 0; i < N; i++) owner.push(-1);
      var seeds = shuffle(owner.map(function (_, ix) { return ix; })).slice(0, K);
      for (i = 0; i < K; i++) { owner[seeds[i]] = i; cells.push([[seeds[i] % W, Math.floor(seeds[i] / W)]]); remain[i]--; }
      for (;;) {
        var open = [];
        for (i = 0; i < K; i++) if (remain[i] > 0) open.push(i);
        if (!open.length) break;
        var pi = open[rand(open.length)], fr = [];
        cells[pi].forEach(function (p) {
          [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (d) {
            var x = p[0] + d[0], y = p[1] + d[1];
            if (x >= 0 && y >= 0 && x < W && y < H && owner[y * W + x] === -1) fr.push([x, y]);
          });
        });
        if (!fr.length) { ok = false; break; }
        var pick = fr[rand(fr.length)];
        owner[pick[1] * W + pick[0]] = pi; cells[pi].push(pick); remain[pi]--;
      }
      if (!ok) continue;
      var pieces = cells.map(function (cs) {
        var mx = 1e9, my = 1e9;
        cs.forEach(function (p) { if (p[0] < mx) mx = p[0]; if (p[1] < my) my = p[1]; });
        return { cells: normCells(cs), sx: mx, sy: my };
      });
      var seen = {}, distinct = true;
      pieces.forEach(function (pc) { var k = canonShape(pc.cells); if (seen[k]) distinct = false; seen[k] = 1; });
      // 1x4 막대(I)가 둘 이상이거나 한 줄짜리 조각이 너무 많으면 심심해서 거른다
      var lines = pieces.filter(function (pc) { var d = boxDims(pc.cells); return d.w === 1 || d.h === 1; }).length;
      if (lines > 1) distinct = false;
      if (distinct || attempt > 500) return pieces;
      if (!fallback) fallback = pieces;
    }
    return fallback;
  }

  function packGame(body, c) {
    var cfg = PACK_CFG[c.level - 1], W = cfg.cols, H = cfg.rows;
    var solved = makePackPlan(cfg);
    // 트레이 순서는 섞고, 각 조각은 무작위로 돌려서 시작한다 (정답 모양 그대로 보이면 안 된다)
    var order = shuffle(solved.map(function (_, i) { return i; }));
    var pieces = order.map(function (si, ti) {
      var sp = solved[si], r0 = rand(4);
      return { base: sp.cells, rot: r0, r0: r0, sx: sp.sx, sy: sp.sy, placed: false, x: 0, y: 0, color: PACK_COLORS[ti % PACK_COLORS.length] };
    });
    if (c.testHooks) body.setAttribute("data-plan", JSON.stringify({ cols: W, rows: H, pieces: pieces.map(function (p) { return { presses: (4 - p.r0) % 4, x: p.sx, y: p.sy }; }) }));

    var cellsHtml = "";
    for (var i = 0; i < W * H; i++) cellsHtml += '<div class="pk-cell"></div>';
    body.innerHTML =
      '<div class="pk-wrap"><div class="pk-box" style="--cols:' + W + ';--rows:' + H + '">' + cellsHtml + '</div>'
      + '<div class="pk-tray"></div></div>'
      + '<p class="mg-freeze-note"></p>'
      + '<div class="pk-pad">'
      + '<button type="button" class="mg-key" data-pk="up" aria-label="위">↑</button>'
      + '<button type="button" class="mg-key" data-pk="left" aria-label="왼쪽">←</button>'
      + '<button type="button" class="mg-key" data-pk="down" aria-label="아래">↓</button>'
      + '<button type="button" class="mg-key" data-pk="right" aria-label="오른쪽">→</button>'
      + '<button type="button" class="mg-key pk-act" data-pk="rotate">회전<small>SPACE</small></button>'
      + '<button type="button" class="mg-key pk-act" data-pk="place">놓기<small>ENTER</small></button>'
      + '<button type="button" class="mg-key pk-act" data-pk="undo">되돌리기<small>⌫</small></button>'
      + '<button type="button" class="mg-key pk-act" data-pk="next">조각 바꾸기<small>TAB</small></button>'
      + "</div>";
    var boxCells = Array.prototype.slice.call(body.querySelectorAll(".pk-cell"));
    var tray = body.querySelector(".pk-tray");
    var note = body.querySelector(".mg-freeze-note");
    var boxEl = body.querySelector(".pk-box");
    var cur = 0, px = 0, py = 0, locked = false, stack = [];

    function shape(p) { return rotCells(p.base, p.rot); }

    function occupancy() {

        if (!p.placed) return;

      });
      return occ;
    }

    function overlaps() {

    function paint() {
      var occ = occupancy(), ghost = {}, bad = overlaps();
      if (!c.isFinished() && !pieces[cur].placed) ghostCells().forEach(function (q) { ghost[q[1] * W + q[0]] = 1; });
      boxCells.forEach(function (el, i) {
        var o = occ[i];
        el.className = "pk-cell" + (o >= 0 ? " is-fill" : "") + (ghost[i] ? (bad ? " is-bad" : " is-ghost") : "");
        if (o >= 0) el.style.setProperty("--pc", pieces[o].color);
        else if (ghost[i]) el.style.setProperty("--pc", pieces[cur].color);
        else el.style.removeProperty("--pc");
      });
      tray.innerHTML = pieces.map(function (p, pi) {
        var sh = shape(p), d = boxDims(sh), m = {};
        sh.forEach(function (q) { m[q[1] * d.w + q[0]] = 1; });
        var g = "";
        for (var yy = 0; yy < d.h; yy++) for (var xx = 0; xx < d.w; xx++) g += '<i class="pk-mini' + (m[yy * d.w + xx] ? " on" : "") + '"></i>';
        return '<button type="button" class="pk-piece' + (p.placed ? " is-placed" : "") + (pi === cur && !p.placed ? " is-active" : "") + '" data-pi="' + pi + '" style="--pc:' + p.color + '" aria-label="조각 ' + (pi + 1) + '">'

      }).join("");

    function say(msg, ms) {

    function select(i) {
      cur = i;
      var p = pieces[cur];
      if (!p.placed) { var d = boxDims(shape(p)); px = clamp(px, 0, W - d.w); py = clamp(py, 0, H - d.h); }

    }

    function act(a) {
      if (c.isFinished() || locked) return;
      if (a === "left" || a === "right" || a === "up" || a === "down") {
        if (pieces[cur].placed) return;

        clampPos();

          restartAnim(boxEl, "is-shake");

      var a = null;
      if (e.key === "ArrowLeft") a = "left";
      else if (e.key === "ArrowRight") a = "right";
      else if (e.key === "ArrowUp") a = "up";
      else if (e.key === "ArrowDown") a = "down";
      else if (e.code === "Space" || e.key === " ") a = "rotate";
      else if (e.key === "Enter") a = "place";
      else if (e.key === "Backspace" || e.key === "z" || e.key === "Z") a = "undo";
      else if (e.key === "Tab") a = "next";
      if (!a) return;
      e.preventDefault();
      e.stopPropagation(); // 게임 본체의 전역 스페이스바/방향키 핸들러가 이 키를 따로 처리하지 않게 막는다

    c.onCleanup(function () { document.removeEventListener("keydown", onKey, true); });

      b.addEventListener("pointerdown", function (e) { e.preventDefault(); act(b.getAttribute("data-pk")); });
    });
    tray.addEventListener("pointerdown", function (e) { // 트레이의 조각을 누르면 그 조각을 고른다
      var t = e.target.closest ? e.target.closest(".pk-piece") : null;
      if (!t || c.isFinished() || locked) return;
      var pi = parseInt(t.getAttribute("data-pi"), 10);
      if (pieces[pi].placed) return;
      e.preventDefault(); select(pi); paint();
    });
    paint();
    return {
      hint: function () {
        return "조각들을 상자 칸에 빈틈없이 채우세요. 방향키(←↑↓→)로 조각을 옮기고, 스페이스로 돌리고, 엔터로 놓아요. 안 맞으면 백스페이스로 되돌리고, 탭으로 다른 조각을 고를 수 있어요. 겹치게 놓으면 실수!";
      },
    };
  }

  // ======================================================================
  // 이상 확인 (초밥 검수) -- 벨트로 들어오는 초밥의 "앞면 · 옆면 · 주문표"을 서로 맞춰 보고,
  //   셋이 모두 같은 종류를 가리키면 그 종류 칸으로 보내고, 하나라도 다르면 폐기한다.
  //   ← 일반   ↓ 중급   → 특선 초밥   SPACE 정보가 안 맞는 초밥 폐기
  // 2026-10-07 재설계 (사용자 피드백: "분류 + 이상품 SPACE는 반응속도 게임이다. 두 정보가 일치하지 않을 때만 폐기하게 해서
  //   판단이 들어가게") + 같은 날 "정보가 너무 많아 오히려 복잡하다" -> 단서를 두 개로 줄였다:
  //     옆면 = 취급 그림 (일반=위 화살표 상자, 중급=유리잔, 특선 초밥=보석)
  //     주문표 = 내용물 글자 (예: 옷/책 = 일반, 유리컵/도자기 = 중급, 시계/노트북 = 특선 초밥)
  //   둘이 같은 종류면 그 칸으로, 서로 다르면 SPACE 폐기. 앞면 띠/흠집 같은 추가 정보는 없다(맨 상자).
  // 분류 3종은 게임의 실제 카테고리(일반/중급/특선 초밥)와 같은 색을 쓴다.
  // 내부 kind 키는 그대로 "inspect" (game-data.js의 TYPES.mini와 시험장이 이 이름을 쓴다).
  // ======================================================================
  //   n 초밥 수, bad 그림과 글자가 안 맞는 초밥 수, hard 주문표 내용물을 덜 뻔한 단어로(0 쉬움/1 어려움)
  var INSPECT_CFG = [
    { n: 6,  bad: 2, hard: 0 },
    { n: 9,  bad: 3, hard: 0 },
    { n: 11, bad: 4, hard: 1 },
  ];
  var CLASSES = [
    { key: "left",  name: "일반",   tag: "일반",   color: "#C9A576", light: "#ddc08f", keyGlyph: "←", hint: "옷 · 책 · 생활용품" },
    { key: "down",  name: "중급", tag: "깨짐주의", color: "#C7E29A", light: "#dcefb8", keyGlyph: "↓", hint: "유리 · 도자기 · 화분" },
    { key: "right", name: "특선 초밥", tag: "특선 초밥", color: "#F0B84A", light: "#f7d37e", keyGlyph: "→", hint: "시계 · 보석 · 전자기기" },
  ];
  var ACT_CLASS = { left: 0, down: 1, right: 2 };
  // 주문표 내용물 단어. 쉬운 단어 + (hard일 때) 덜 뻔한 단어도 섞는다. 종류 사이에 겹치는 단어는 없다.
  var SLIP_WORDS = [
    [["옷", "책", "수건", "양말", "담요"], ["이불", "운동화", "프라이팬", "필통", "베개"]],
    [["유리컵", "화분", "도자기", "거울", "접시"], ["전구", "와인", "찻잔", "유리병", "꽃병"]],
    [["시계", "반지", "목걸이", "현금"], ["노트북", "금팔찌", "명품백", "상품권", "카메라"]],
  ];

  // 옆면의 취급 그림 (가운데 좌표 0,0 기준 -- 호출하는 쪽이 translate)
  function sideIcon(clsIdx) {
    if (clsIdx === 0) { // 위 화살표가 있는 상자
      return '<rect x="-9" y="-3" width="18" height="14" rx="1.5" fill="none" stroke="#3a2812" stroke-width="1.8"/>'
        + '<path d="M0 -14v13M-5 -9l5-5 5 5" fill="none" stroke="#3a2812" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
    }
    if (clsIdx === 1) { // 유리잔
      return '<path d="M-9 -13h18l-2 11a7 7 0 0 1-14 0Z" fill="rgba(255,255,255,.55)" stroke="#3a2812" stroke-width="1.8" stroke-linejoin="round"/>'
        + '<path d="M0 3v10M-6 13h12" stroke="#3a2812" stroke-width="1.8" stroke-linecap="round"/>';
    }
    return '<path d="M-10 -6l5-7h10l5 7-10 14Z" fill="#7fd0e8" stroke="#3a2812" stroke-width="1.6" stroke-linejoin="round"/>'
      + '<path d="M-10 -6h20M-3 -6l3 14 3-14" fill="none" stroke="#3a2812" stroke-width="1.1"/>'; // 보석
  }

  // 초밥 하나를 그린다: 옆면(그림) + 주문표(내용물). 앞면은 모두 같은 맨 상자(정보 없음). item = { side, slip(단어), bad }.
  function pkgSvg(item) {
    var s = '<svg viewBox="0 0 190 100" aria-hidden="true">'
      + '<ellipse cx="95" cy="92" rx="88" ry="5" fill="rgba(43,29,18,.18)"/>'
      + '<rect x="6" y="24" width="70" height="62" rx="3" fill="#cfae7a" stroke="#6b4e26" stroke-width="1.8"/>'
      + '<rect x="6" y="24" width="70" height="12" rx="3" fill="#ddc08f" stroke="#6b4e26" stroke-width="1.8"/>'
      + '<rect x="34" y="24" width="14" height="34" fill="#ead8b0" opacity=".95"/>';
    // 옆면: 취급 그림
    s += '<polygon points="76,24 104,16 104,78 76,86" fill="#d9b982" stroke="#6b4e26" stroke-width="1.8" stroke-linejoin="round"/>'
      + '<g transform="translate(90 51) scale(0.95)">' + sideIcon(item.side) + '</g>';
    // 주문표: 종이 라벨, 내용물 글자
    s += '<rect x="112" y="22" width="72" height="62" rx="2.5" fill="#fffefa" stroke="#9a8460" stroke-width="1.4"/>'
      + '<rect x="112" y="22" width="72" height="11" rx="2.5" fill="#E8681C"/>'
      + '<text x="148" y="30.5" text-anchor="middle" font-size="8" font-weight="800" fill="#fff8ef" letter-spacing="2">주문표</text>'
      + '<text x="148" y="62" text-anchor="middle" font-size="' + (item.slip.length > 3 ? 14 : 17) + '" font-weight="800" fill="#2b1d12">' + item.slip + '</text>';
    return s + "</svg>";
  }

  function makeInspectItems(cfg) {
    var badAt = {};
    shuffle(Array.apply(null, { length: cfg.n }).map(function (_, i) { return i; })).slice(0, cfg.bad).forEach(function (i) { badAt[i] = true; });
    var items = [];
    for (var i = 0; i < cfg.n; i++) {
      var cls = rand(3), bad = !!badAt[i], sideCls = cls, slipCls = cls;
      if (bad) { var other = (cls + 1 + rand(2)) % 3; if (Math.random() < 0.5) sideCls = other; else slipCls = other; }
      var pool = SLIP_WORDS[slipCls], words = cfg.hard && Math.random() < 0.6 ? pool[1] : pool[0];
      items.push({ cls: cls, bad: bad, side: sideCls, slip: words[rand(words.length)] });
    }
    return items;
  }

  var INSPECT_LOCK_MS = 900; // 틀린 키 뒤 멈춤 -- 아무 키나 연타해서 뚫는 걸 막고, 다시 확인할 시간을 준다

  function inspectGame(body, c) {
    var cfg = INSPECT_CFG[c.level - 1];
    var items = makeInspectItems(cfg);
    var expected = items.map(function (it) { return it.bad ? "space" : CLASSES[it.cls].key; });
    if (c.testHooks) body.setAttribute("data-seq", expected.join(","));

    var binsHtml = CLASSES.map(function (k, ci) {
      return '<button type="button" class="mg-bin" data-a="' + k.key + '" style="--bin:' + k.color + '" aria-label="' + k.name + '">'
        + '<span class="mg-bin-k">' + k.keyGlyph + '</span><span class="mg-bin-n">' + k.name + '</span>'
        + '<svg class="mg-bin-ico" viewBox="-14 -16 28 32" aria-hidden="true">' + sideIcon(ci) + '</svg>'
        + '<span class="mg-bin-s">' + k.hint + '</span></button>';
    }).join("");
    body.innerHTML = '<div class="mg-belt"><div class="mg-gate" aria-hidden="true"><span>검수대</span></div><div class="mg-queue"></div></div>'
      + '<p class="mg-progress">처리 <em class="mg-found">0</em> / ' + cfg.n + '개</p>'
      + '<p class="mg-freeze-note"></p>'
      + '<div class="mg-bins">' + binsHtml + '</div>'
      + '<button type="button" class="mg-bin mg-discard" data-a="space" aria-label="정보가 안 맞는 초밥 폐기"><span class="mg-bin-k">SPACE</span><span class="mg-bin-n">그림과 글자가 다르면 폐기</span></button>';

    var queue = body.querySelector(".mg-queue");
    var doneEl = body.querySelector(".mg-found");
    var note = body.querySelector(".mg-freeze-note");
    var els = items.map(function (it, i) {
      var d = el("div", "mg-pkg", pkgSvg(it));
      d.style.setProperty("--i", i);
      queue.appendChild(d);
      return d;
    });
    var idx = 0, locked = false;
    function setFront() {
      queue.style.setProperty("--shift", idx);
      els.forEach(function (d, i) { d.classList.toggle("is-front", i === idx); });
    }

    function act(a) {
      if (locked || c.isFinished() || idx >= cfg.n) return;
      var btn = body.querySelector('.mg-bin[data-a="' + a + '"]');
      if (a === expected[idx]) {
        var d = els[idx];
        d.classList.add(items[idx].bad ? "is-zap" : "is-sent");
        if (btn) restartAnim(btn, "is-ok");
        idx++;
        doneEl.textContent = idx;
        setFront();
        if (idx === cfg.n) c.later(c.finish, 380);
        return;
      }
      // 오입력: 실수 +1, 앞 초밥은 그대로 남고 잠깐 멈춘다
      c.addMistake();
      locked = true;
      restartAnim(els[idx], "mg-shake");
      if (btn) restartAnim(btn, "is-wrong");
      note.textContent = items[idx].bad && a !== "space" ? "그림과 글자가 달라요 — 폐기!" : (a === "space" ? "그림과 글자가 같은 종류예요" : "다른 칸이에요 — 그림과 글자를 다시 보세요");
      c.later(function () { locked = false; note.textContent = ""; }, INSPECT_LOCK_MS);
    }

    function onKey(e) {
      if (e.repeat || c.isFinished()) return;
      var a = null;
      if (e.key === "ArrowLeft") a = "left";
      else if (e.key === "ArrowDown") a = "down";
      else if (e.key === "ArrowRight") a = "right";
      else if (e.code === "Space" || e.key === " ") a = "space";
      else if (e.key === "ArrowUp") { e.preventDefault(); return; } // 쓰지 않는 키지만 화면이 스크롤되지 않게
      if (!a) return;
      e.preventDefault();
      e.stopPropagation();
      act(a);
    }
    document.addEventListener("keydown", onKey, true);
    c.onCleanup(function () { document.removeEventListener("keydown", onKey, true); });
    Array.prototype.forEach.call(body.querySelectorAll(".mg-bin"), function (b) {
      b.addEventListener("pointerdown", function (e) { e.preventDefault(); act(b.getAttribute("data-a")); });
    });
    setFront();
    return { hint: function () { return "옆면 그림과 주문표 글자가 같은 종류면 그 칸으로(← 일반 · ↓ 중급 · → 특선 초밥), 서로 다르면 SPACE로 폐기. 틀리면 잠깐 멈춰요."; } };
  }

  // ======================================================================
  // 주문표 붙이기 -- 주문표의 정보(서빙코드 + 취급 + 접시)와 "일부만 적힌" 상자들을 맞춰 보고, 딱 하나로 특정되는 상자에 붙이기
  // ======================================================================
  // (2026-10-06 개편) 코드를 읽고 같은 상자를 찾는 게임이었다.
  // (2026-10-07 재설계, 사용자 피드백: "코드 확인 -> 같은 코드 상자 찾기 -> 붙이기는 너무 명확하다. 상자에 코드가 온전히 안 적혀 있고
  //  일부 정보만 있어서, 여러 정보를 조합해야 하나로 특정되게") 주문표는 B-17 / 깨짐 / 4F 처럼 세 정보를 갖고,
  // 상자에는 코드의 한 글자가 가려져 있고(B-□7), 취급과 접시는 있거나 없다(? 표시). 상자 하나의 보이는 정보가 전부 주문표와 맞아야만
  // "맞는 상자"고, 그런 상자는 항상 정확히 하나다 -- 코드만 맞는 상자(B-□7인데 취급이 다름)가 일부러 섞여 있어서
  // "B-17이니까 이거?" -> "아니네, 취급이 달라" -> "그럼 이거다" 처럼 조합해서 추리해야 한다. (틀리면 실수 + 멈춤)
  var STK_BOXES  = [4, 7, 8];   // 레벨별 상자 수
  var STK_LABELS = [2, 4, 5];   // 레벨별 주문표 장수 (붙일 상자 수)
  var STK_HIDE   = [0.25, 0.5, 0.62]; // 상자에서 취급/접시 정보를 가릴 확률 (높을수록 코드와 조합해야 한다)
  var STK_FLOOR_FIELD = ["1F", "2F", "3F", "4F", "5F"];
  var STK_LETTERS = ["A", "B", "C", "D", "E"];
  var STK_LOCK_MS = 900;        // 틀린 상자에 붙인 뒤 멈춤 -- 다시 추리할 시간 (이상 확인과 같은 값)
  var LW = 22, LH = 22.5;       // 주문표 크기 (스테이지 대비 %, 스테이지 520:320)
  var TRAY_X = (100 - LW) / 2, TRAY_Y = 75.5;

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  // 주문표 코드 "B-17": 글자 1 + 숫자 2. 마스크 위치 0 = 글자, 1 = 십의 자리, 2 = 일의 자리.
  function codeChars(b) { return [b.letter, String(b.num).charAt(0), String(b.num).charAt(1)]; }
  // box(가려진 정보 포함)가 inv와 "보이는 부분이 전부 일치"하는가. codeOnly면 취급/접시는 무시.
  function stkCompat(box, inv, codeOnly) {
    var bc = codeChars(box), ic = codeChars(inv);
    for (var i = 0; i < 3; i++) if (i !== box.mask && bc[i] !== ic[i]) return false;
    if (codeOnly) return true;
    if (!box.hideG && box.grade !== inv.grade) return false;
    if (!box.hideF && box.floor !== inv.floor) return false;
    return true;
  }

  // 상자 n개(정답 k개 포함)와 주문표 순서를 만든다. 모든 정답 주문표가 정확히 한 상자와만 맞고, 코드만 맞는 상자가 따로 있도록 시도한다.
  function makeStickerPlan(level, n, k) {
    var hide = STK_HIDE[level - 1];
    var best = null;
    for (var attempt = 0; attempt < 4000; attempt++) {
      // 모든 상자가 비슷해 보이도록 숫자는 작은 집합(3개)에서만, 글자도 2개에서만 뽑는다
      var digits = shuffle(["1", "2", "3", "7", "8", "9"]).slice(0, 3), letters = shuffle(STK_LETTERS).slice(0, 2);
      var used = {}, boxes = [], guard = 0;
      while (boxes.length < n && guard++ < 300) {
        var b = { letter: letters[rand(2)], num: parseInt(digits[rand(3)] + digits[rand(3)], 10),
          grade: rand(3), floor: STK_FLOOR_FIELD[rand(5)] };
        var key = b.letter + b.num + "/" + b.grade + "/" + b.floor;
        if (used[key]) continue;
        used[key] = 1;
        b.mask = rand(3); b.hideG = Math.random() < hide; b.hideF = Math.random() < hide;
        boxes.push(b);
      }
      if (boxes.length < n) continue;
      var order = shuffle(boxes.map(function (_, i) { return i; })), targets = order.slice(0, k);
      var ok = true, nearCode = 0;
      for (var ti = 0; ti < targets.length && ok; ti++) {
        var inv = boxes[targets[ti]], match = 0, near = 0;
        boxes.forEach(function (bx, bi) {
          if (stkCompat(bx, inv, false)) match++;
          else if (bi !== targets[ti] && stkCompat(bx, inv, true)) near++;
        });
        if (match !== 1) ok = false;
        if (near >= 1) nearCode++;
      }
      if (!ok) continue;
      // 레벨 2 이상은 정답 주문표 대부분에 "코드만 맞는 함정 상자"가 있어야 한다 (조합해야 풀리게)
      var need = level === 1 ? 0 : (level === 2 ? Math.ceil(k * 0.6) : k);
      var plan = { boxes: boxes, seq: shuffle(targets), near: nearCode };
      if (nearCode >= need) return plan;
      if (!best || nearCode > best.near) best = plan;
    }
    if (best) return best;
    throw new Error("sticker plan failed");
  }

  var GRADE_NAME = ["일반", "깨짐", "귀중"];
  function codeHtml(b, masked) {
    var ch = codeChars(b), out = "";
    for (var i = 0; i < 3; i++) {
      if (i === 1) out += "-";
      out += (masked && i === b.mask) ? '<u class="bx-hole"></u>' : ch[i];
    }
    return out;
  }

  function stickerGame(body, c) {
    var n = STK_BOXES[c.level - 1], k = STK_LABELS[c.level - 1];
    var plan = makeStickerPlan(c.level, n, k);

    var boxHtml = plan.boxes.map(function (b, bi) {
      var g = b.hideG ? '<span class="bx-chip is-hid">?</span>' : '<span class="bx-chip g' + b.grade + '">' + GRADE_NAME[b.grade] + '</span>';
      var f = b.hideF ? '<span class="bx-chip is-hid">?</span>' : '<span class="bx-chip fl">' + b.floor + '</span>';
      return '<div class="mg-bx" data-i="' + bi + '"><div class="bx-top"></div><div class="bx-front">'
        + '<div class="bx-addr"><i>받는 곳</i><b>' + codeHtml(b, true) + '</b></div>'
        + '<div class="bx-meta">' + g + f + '</div><div class="bx-slot"></div></div>'
        + '<div class="bx-tape"></div><span class="bx-ok" aria-hidden="true">✓</span></div>';
    }).join("");
    body.innerHTML = '<div class="mg-stage" data-total="' + k + '"><div class="mg-bxs">' + boxHtml + '</div>'
      + '<div class="mg-tray"><span class="mg-tray-note"></span></div></div>'
      + '<div class="mg-pad">'
      + '<button type="button" class="mg-key" data-k="up" aria-label="위">↑</button>'
      + '<button type="button" class="mg-key" data-k="left" aria-label="왼쪽">←</button>'
      + '<button type="button" class="mg-key" data-k="down" aria-label="아래">↓</button>'
      + '<button type="button" class="mg-key" data-k="right" aria-label="오른쪽">→</button>'
      + '<button type="button" class="mg-key" data-k="space" aria-label="스페이스">SPACE · 붙이기</button>'
      + "</div>";
    var stage = body.querySelector(".mg-stage");
    // 좁은 화면(폰): 상자 안 글자가 읽히도록 무대를 세로로 늘리고 상자를 한 줄 3개로 키운다. 주문표도 가로로 넓힌다.
    var narrow = stage.clientWidth > 0 && stage.clientWidth < 460;
    var lw = LW, lh = LH, ty = TRAY_Y;
    if (narrow) { stage.classList.add("is-narrow"); lw = 38; lh = 19.5; ty = 76.5; }
    if (n > 6) { stage.style.setProperty("--bw", narrow ? "29cqw" : "21cqw"); stage.style.setProperty("--ggap", narrow ? "2.6cqw 2.4cqw" : "2.2cqw 2.2cqw"); } // 7개 이상: 한 줄 4개(넓은 화면) / 3개(폰)
    if (c.testHooks) body.setAttribute("data-plan", JSON.stringify({ seq: plan.seq, near: plan.near }));
    var boxes = Array.prototype.slice.call(body.querySelectorAll(".mg-bx"));
    var note = body.querySelector(".mg-tray-note");
    var placed = 0, current = null;
    var cursor = 0, keyLocked = false; // 지금 고른 상자(boxes 인덱스)


    // ---- 조작은 키보드 전용 (2026-10-07: 마우스 끌어다 놓기 제거): ←→ 상자 고르기, ↑↓ 윗줄/아랫줄 상자로, 스페이스 = 지금 주문표를 고른 상자에 붙이기.
    // 화면 아래 방향키/스페이스 버튼은 다른 미니게임과 같은 터치용 패드(폰) -- 누르면 같은 동작이다. ----
    function paintCursor() { boxes.forEach(function (x, i) { x.classList.toggle("is-cursor", i === cursor && !x.classList.contains("is-done")); }); }
    function nextOpen(from, step) { // from에서 step(+1/-1) 방향으로 아직 안 붙인 상자 (한 바퀴 돎)
      for (var i = 1; i <= boxes.length; i++) {
        var j = (from + step * i + boxes.length * 2) % boxes.length;
        if (!boxes[j].classList.contains("is-done")) return j;
      }
      return from;
    }
    function moveRow(dir) { // dir -1 = 위, +1 = 아래: 다른 줄의 안 붙인 상자 중 가로 위치가 가장 가까운 것
      var me = boxes[cursor].getBoundingClientRect(), mx = me.left + me.width / 2, my = me.top + me.height / 2;
      var best = -1, bestD = 1e9;
      boxes.forEach(function (x, i) {
        if (i === cursor || x.classList.contains("is-done")) return;
        var r = x.getBoundingClientRect(), cy = r.top + r.height / 2;
        if (dir < 0 ? cy >= my - me.height / 2 : cy <= my + me.height / 2) return; // 다른 줄이 아니면 건너뜀
        var d = Math.abs(r.left + r.width / 2 - mx) + Math.abs(cy - my) * 0.01;
        if (d < bestD) { bestD = d; best = i; }
      });
      if (best >= 0) cursor = best;
    }
    function keyAttach() {

    function spawnLabel() {

    // 주문표가 상자 앞면의 주문표 자리로 줄어들며 붙는다

  // ======================================================================
  // 주문 서빙 (2026-10-07: 특선 초밥의 우봉고를 대체)
  //   1) 주문표 단계: 지도는 가려져 있고, "주문표만 붙은 초밥" 여러 개(예: 103호, 201호 ...)가 순서대로 팝업으로 떴다가 사라진다.
  //   2) 지도 단계: 초밥이 사라지고 지도가 뜬다 -- 집마다 호실 번호가 적혀 있어서, 외운 호실의 집을 지도에서 찾아
  //      방향키로 이동해 도착하면 스페이스로 서빙한다. 외운 순서대로.

  //      공짜지만 그만큼 시간이 가므로 사실상의 비용은 시간이다. 그 전에는 못 본다 -- 처음에 제대로 외워야 한다.
  //   (이력: 1차는 목표 집이 지도 위에서 번호와 함께 켜졌다. 2차는 호실 번호 목록만 먼저 띄웠다. 사용자가 "주문표만 붙은 초밥 4개가
  //    팝업으로 보였다 사라지고, 이후 지도가 표시되고, 20초 뒤부터는 다시 호수를 확인"으로 정정해서 지금 형태가 됐다.)

  //   틀린 서빙(엉뚱한 집/도로/이미 서빙한 집/순서 틀림)은 실수 +1 이고 0.8초 멈춘다 -- 진행은 유지.
  // ======================================================================
  // targets = 외워야 할 주문표(초밥) 수: 전반(레벨 2) 3개, 후반(레벨 3) 4개 (2026-10-07 사용자 요청). 레벨 1은 시험장 전용.
  var MAP_CFG = [
    { cols: 5, rows: 4, houses: 8,  targets: 2, flashMs: 4500, similar: 0, blocks: 0 },
    // 2026-10-07 난이도 업: 외울 개수(3/4)와 주문표 다시 보기 20초는 사용자 지정값이라 그대로 두고, 팝업 시간을 줄이고 미끼/공사장을 늘렸다.
    { cols: 6, rows: 4, houses: 11, targets: 3, flashMs: 3000, similar: 4, blocks: 2 },
    { cols: 7, rows: 5, houses: 14, targets: 4, flashMs: 2500, similar: 6, blocks: 6 },
  ];
  var MAP_REPLAY_AFTER_MS = 20000; // 게임 시작 후 이 시간이 지나야 "주문표 다시 보기"가 열린다

  var MAP_LOCK_MS = 800;   // 틀린 서빙 뒤 멈춤

  var MAP_VEC = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  // 지도를 돌아다니는 셰프 (쟁반을 든 모습). 이름은 예전 VAN_SVG 그대로 두고 그림만 교체.
  var VAN_SVG = '<svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="31" rx="16" ry="5" class="mg-van-box"/><circle cx="20" cy="17" r="7" class="sk-m-face"/><path d="M12 13c-2-6 3-9 6-6 1-3 6-3 7 0 3-3 8 0 6 6-4-1-15-1-19 0Z" class="sk-m-cap"/><path d="M11 36c0-7 4-11 9-11s9 4 9 11Z" class="sk-m-body"/><circle cx="17.3" cy="17.5" r="1" class="sk-m-eye"/><circle cx="22.7" cy="17.5" r="1" class="sk-m-eye"/></svg>';

  function mapKey(x, y) { return x + "," + y; }
  // 주문 번호: 접시 색(빨강~보라) + 번호(1~9) = "주황 3번". 게임 본체의 주문표 표기(roomCode)와 같다.
  // 목표는 무작위, 미끼 중 similar개는 목표와 같은 접시 색 또는 같은 번호(번갈아)를 가진다.
  var MAP_PLATES = ["빨강", "주황", "노랑", "초록", "파랑", "보라"];
  // 접시 색: 게임 본체의 PLATE_HEX(build_client.py)와 같은 순서/색. rim은 접시 가장자리(진한 색).
  var MAP_PLATE_FILL = ["#E0443E", "#F28C28", "#F4D03F", "#3FAE5A", "#3D7FD9", "#8E5BC8"];
  var MAP_PLATE_RIM  = ["#A92B27", "#B8641A", "#B8961C", "#27783C", "#2658A6", "#623A92"];
  // 2026-10-12: 주문 번호를 "빨강 3번" 글자가 아니라 접시 그림으로 -- 그 색의 접시 위에 번호가 적힌 모양 (사용자 요청).
  //   글자는 화면에 없고, 접근성/시험용으로 data-label / aria-label에만 "빨강 3번" 형태로 남긴다.
  function plateSvg(f, r) {
    return '<svg class="mg-psvg" viewBox="0 0 64 64" aria-hidden="true">'
      + '<circle cx="32" cy="32" r="30" fill="' + MAP_PLATE_RIM[f] + '" stroke="#2b1d12" stroke-width="2.4"/>'
      + '<circle cx="32" cy="32" r="24.5" fill="' + MAP_PLATE_FILL[f] + '"/>'
      + '<circle cx="32" cy="32" r="19" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.6"/>'
      + '<path d="M13 24a21 21 0 0 1 14-10" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="2.6" stroke-linecap="round"/>'
      + '<text x="32" y="33" text-anchor="middle" dominant-baseline="central" class="mg-pnum">' + r + '</text></svg>';
  }
  function plateHtml(cls, label, meta) {
    return '<span class="' + cls + '" data-label="' + label + '" role="img" aria-label="' + label + '">' + plateSvg(meta.f, meta.r) + '</span>';
  }
  function assignRoomLabels(houses, targets, similar) {
    var used = {}, meta = {};
    function code(f, r) { var cd = MAP_PLATES[f] + " " + r + "번"; meta[cd] = { f: f, r: r }; return cd; }
    function takeRandom() {
      for (;;) { var cd = code(rand(MAP_PLATES.length), 1 + rand(9)); if (!used[cd]) { used[cd] = 1; return cd; } }
    }
    targets.forEach(function (t) { t.label = takeRandom(); t.f = meta[t.label].f; t.r = meta[t.label].r; });
    var tset = {}; targets.forEach(function (t) { tset[mapKey(t.x, t.y)] = 1; });
    var decoys = shuffle(houses.filter(function (h) { return !tset[mapKey(h.x, h.y)]; }));
    var n = Math.min(similar, decoys.length, targets.length);
    for (var i = 0; i < decoys.length; i++) {
      var cand = [];
      if (i < n) {
        var m = meta[targets[i].label], f = m.f, r = m.r;
        for (var a = 0; a < MAP_PLATES.length; a++) for (var b = 1; b <= 9; b++) {
          var same = i % 2 === 0 ? (a === f && b !== r) : (b === r && a !== f); // 짝수: 같은 접시 다른 번호 / 홀수: 같은 번호 다른 접시
          if (same && !used[code(a, b)]) cand.push(code(a, b));
        }

      if (cand.length) { var pick = cand[rand(cand.length)]; used[pick] = 1; decoys[i].label = pick; }
      else decoys[i].label = takeRandom();

  function makeMapPlan(cfg, noBlocks) {
    var W = cfg.cols, H = cfg.rows, nb = noBlocks ? 0 : cfg.blocks;
    var depot = { x: Math.floor(W / 2), y: H - 1 };
    for (var tries = 0; tries < 300; tries++) {
      var all = [];
      for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) if (!(x === depot.x && y === depot.y)) all.push({ x: x, y: y });
      var sh = shuffle(all);
      var blocked = sh.slice(0, nb), houses = sh.slice(nb, nb + cfg.houses);
      var blockSet = {}; blocked.forEach(function (b) { blockSet[mapKey(b.x, b.y)] = 1; });
      var seen = {}; seen[mapKey(depot.x, depot.y)] = 1;
      var q = [depot];
      while (q.length) {
        var p = q.shift();
        for (var d in MAP_VEC) {
          var nx = p.x + MAP_VEC[d][0], ny = p.y + MAP_VEC[d][1], nk = mapKey(nx, ny);
          if (nx < 0 || ny < 0 || nx >= W || ny >= H || blockSet[nk] || seen[nk]) continue;
          seen[nk] = 1; q.push({ x: nx, y: ny });
        }
      }
      var ok = houses.every(function (h) { return seen[mapKey(h.x, h.y)]; });
      if (!ok) continue; // 공사장 때문에 갈 수 없는 집이 생겼으면 다시 뽑는다
      var targets = shuffle(houses).slice(0, cfg.targets);
      assignRoomLabels(houses, targets, cfg.similar);
      return { W: W, H: H, depot: depot, blocked: blocked, houses: houses, targets: targets };
    }
    return noBlocks ? null : makeMapPlan(cfg, true); // (사실상 도달 불가) 공사장 없이라도 만든다
  }

  function mapGame(body, c) {
    var cfg = MAP_CFG[c.level - 1];
    var plan = makeMapPlan(cfg);
    var W = plan.W, H = plan.H, N = plan.targets.length;
    var houseAt = {}, blockAt = {};
    plan.houses.forEach(function (h) { houseAt[mapKey(h.x, h.y)] = h; });
    plan.blocked.forEach(function (b) { blockAt[mapKey(b.x, b.y)] = 1; });
    if (c.testHooks) {
      body.setAttribute("data-grid", W + "," + H);
      body.setAttribute("data-depot", mapKey(plan.depot.x, plan.depot.y));
      body.setAttribute("data-blocked", plan.blocked.map(function (b) { return mapKey(b.x, b.y); }).join(";"));
      body.setAttribute("data-targets", plan.targets.map(function (t) { return mapKey(t.x, t.y); }).join(";"));
    }

    var tiles = "";
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var k = mapKey(x, y), h = houseAt[k], isDepot = x === plan.depot.x && y === plan.depot.y;
      tiles += '<div class="mg-tile' + (h ? " is-house" : "") + (blockAt[k] ? " is-block" : "") + (isDepot ? " is-depot" : "") + '" data-x="' + x + '" data-y="' + y + '">'
        + (h ? plateHtml("mg-lab", h.label, h) + '<span class="mg-chk">✓</span>'
          : blockAt[k] ? '<span class="mg-fence"></span>' : isDepot ? '<span class="mg-dep">주방</span>' : "")
        + "</div>";
    }
    var dots = ""; for (var di = 0; di < N; di++) dots += '<span class="mg-dot"></span>';
    body.innerHTML =
      '<div class="mg-map-top"><div class="mg-flashbar"><i></i></div><p class="mg-phase"></p></div>'
      + '<div class="mg-map is-covered" style="--cols:' + W + ';--rows:' + H + '">' + tiles
      + '<div class="mg-courier" style="--cx:' + plan.depot.x + ';--cy:' + plan.depot.y + '">' + VAN_SVG + '</div>'
      + '<div class="mg-cover"><div class="mg-parcels"></div><span class="mg-cover-note">홀 지도는 주문표를 확인한 뒤에 나와요</span></div></div>'
      + '<div class="mg-map-foot"><div class="mg-dots">' + dots + '</div><button type="button" class="mg-replay" tabindex="-1" disabled>주문표 다시 보기</button></div>'
      + '<p class="mg-freeze-note"></p>'
      + '<div class="mg-pad">'
      + '<button type="button" class="mg-key" data-k="up" aria-label="위">↑</button>'
      + '<button type="button" class="mg-key" data-k="left" aria-label="왼쪽">←</button>'
      + '<button type="button" class="mg-key" data-k="down" aria-label="아래">↓</button>'
      + '<button type="button" class="mg-key" data-k="right" aria-label="오른쪽">→</button>'
      + '<button type="button" class="mg-key" data-k="space" aria-label="스페이스">SPACE · 서빙</button>'
      + "</div>";

    var map = body.querySelector(".mg-map"), courier = body.querySelector(".mg-courier");
    var parcelsEl = body.querySelector(".mg-parcels"), phaseEl = body.querySelector(".mg-phase"), barEl = body.querySelector(".mg-flashbar > i");
    var note = body.querySelector(".mg-freeze-note"), replay = body.querySelector(".mg-replay");

    function tileAt(x, y) { return map.querySelector('.mg-tile[data-x="' + x + '"][data-y="' + y + '"]'); }

    var pos = { x: plan.depot.x, y: plan.depot.y }, idx = 0, phase = "invoice", locked = false, lastStep = 0;
    var startedAt = performance.now(), replayAfter = typeof c.opts.replayAfterMs === "number" ? c.opts.replayAfterMs : MAP_REPLAY_AFTER_MS;

    function paintDots() {

    }
    // 주문표 단계: 지도를 가리고 그 위에 "주문표만 붙은 초밥"를 순서대로 팝업으로 띄운다(이미 서빙한 호실은 흐리게 + 체크로 같이 보여 줘서
    // 번호 순서가 그대로 유지된다). 처음 한 번 + "다시 보기" 때.
    function showInvoice() {
      phase = "invoice";
      map.classList.add("is-covered");
      var html = "";
      for (var i = 0; i < N; i++) {
        html += '<div class="mg-parcel' + (i < idx ? " is-done" : "") + '" style="--d:' + (i * MAP_POP_STAGGER_MS) + 'ms">'
          + '<i class="pn">' + (i + 1) + '</i>' + plateHtml("pbox", plan.targets[i].label, plan.targets[i]) + '<span class="pk">✓</span></div>';
      }
      parcelsEl.innerHTML = html; // 새로 그려야 팝업 애니메이션이 처음부터 다시 돈다
      phaseEl.textContent = "초밥 주문표를 외우세요! 이 순서대로 서빙해요";
      barEl.style.transition = "none"; barEl.style.width = "100%";

    }

          + "비슷한 번호의 자리가 섞여 있어요. 엉뚱한 자리에서 서빙하면 실수예요. 시작 " + Math.round(replayAfter / 1000) + "초 뒤부터는 주문표를 다시 볼 수 있어요.";

  }

  var SK_BOX_SVG = '<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="4" y="7" width="32" height="28" rx="2.5" class="sk-bx-body"/><rect x="4" y="7" width="32" height="8" rx="2.5" class="sk-bx-top"/><path class="sk-bx-tape" d="M9 25c4-6 11-6 15 0c-4 6-11 6-15 0ZM24 25l6-4.5v9Z"/><path class="sk-bx-ok" d="M12 25l6 6 11-12"/></svg>';

    var rows = pool[rand(pool.length)];

      else if (e.key === "ArrowDown") a = "down";

      },
    };
  }

  // ======================================================================
  // 2026-10-08 소코반 같은 류의 시험용 게임 4종 + 하노이 (사용자: "다 게임 테스트로만 만들어보자").
  // 전부 키보드 + 되돌리기(Z / Backspace, 무료) + 처음부터(R) + 터치용 화면 버튼. 시험장 전용 -- TYPES.mini에는 연결하지 않았다.
